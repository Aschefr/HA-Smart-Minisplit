blueprint:
  name: Gestion PAC Master (Avec Auto-Présence & Solaire)
  description: Pilote la PAC en gérant tout : Présence auto, Solaire, Saisons, Delta T et Journal.
  domain: automation
  input:
    # --- BASES ---
    climate_entity:
      name: Thermostat
      selector: { entity: { domain: climate } }
    log_entity:
      name: Journal (Input Text)
      selector: { entity: { domain: input_text } }
    
    # --- BOOLEANS DE CONTRÔLE (Vos boutons Dashboard) ---
    switch_auto:
      name: Master Switch Auto
      selector: { entity: { domain: input_boolean } }
    switch_manual:
      name: Témoin Manuel (Ecrasement)
      selector: { entity: { domain: input_boolean } }
    switch_season:
      name: Mode Saison (OFF=Hiver)
      selector: { entity: { domain: input_boolean } }
    
    # --- GESTION PRESENCE ---
    switch_presence:
      name: État Présence (Résultat)
      selector: { entity: { domain: input_boolean } }
    switch_presence_auto:
      name: Activer Présence Auto ?
      selector: { entity: { domain: input_boolean } }
    raw_presence_sensor:
      name: Capteur de mouvement/zone (Source)
      selector: { entity: { domain: [binary_sensor, input_boolean] } }
    switch_rented:
      name: Appartement Loué ? (Condition)
      selector: { entity: { domain: input_boolean } }

    # --- GESTION CONFORT / SOLAIRE ---
    switch_comfort:
      name: État Confort (Résultat)
      selector: { entity: { domain: input_boolean } }
    switch_comfort_auto:
      name: Activer Confort Auto ?
      selector: { entity: { domain: input_boolean } }
    solar_sensor:
      name: Capteur Solaire / Grid
      selector: { entity: { domain: sensor } }
    solar_threshold:
      name: Seuil activation Solaire (W)
      default: 10000
      selector: { number: { min: 0, max: 20000, mode: box } }

    # --- INPUT NUMBERS (CONSIGNES) ---
    # Pour ne pas surcharger l'affichage ici, on suppose que le générateur
    # remplira ces champs correctement.
    temp_h_abs: { selector: { entity: { domain: input_number } } }
    temp_h_eco: { selector: { entity: { domain: input_number } } }
    temp_h_conf: { selector: { entity: { domain: input_number } } }
    temp_e_abs: { selector: { entity: { domain: input_number } } }
    temp_e_eco: { selector: { entity: { domain: input_number } } }
    temp_e_conf: { selector: { entity: { domain: input_number } } }
    
    # --- TECHNIQUE ---
    delta_sensor:
      name: Capteur Delta T°
      selector: { entity: { domain: sensor } }
    fb_setpoint:
      name: Feedback Consigne (Optionnel)
      default: []
      selector: { entity: { domain: input_number } }
    fb_mode:
      name: Feedback Mode CVC (Optionnel)
      default: []
      selector: { entity: { domain: input_select } }

variables:
  climate: !input climate_entity
  s_auto: !input switch_auto
  s_manual: !input switch_manual
  s_log: !input log_entity
  
  # Présence vars
  s_pres_res: !input switch_presence
  s_pres_auto: !input switch_presence_auto
  s_pres_raw: !input raw_presence_sensor
  s_rented: !input switch_rented
  
  # Confort vars
  s_conf_res: !input switch_comfort
  s_conf_auto: !input switch_comfort_auto
  s_solar: !input solar_sensor
  solar_limit: !input solar_threshold

  # Consignes vars
  th_a: !input temp_h_abs
  th_e: !input temp_h_eco
  th_c: !input temp_h_conf
  te_a: !input temp_e_abs
  te_e: !input temp_e_eco
  te_c: !input temp_e_conf
  
  s_season: !input switch_season
  s_delta: !input delta_sensor
  
  f_point: !input fb_setpoint
  f_mode: !input fb_mode

trigger:
  - platform: state
    entity_id: 
      - !input switch_auto
      - !input switch_manual
      - !input switch_season
      - !input switch_presence
      - !input switch_presence_auto
      - !input raw_presence_sensor
      - !input switch_rented
      - !input switch_comfort
      - !input switch_comfort_auto
      - !input temp_h_abs
      - !input temp_h_eco
      - !input temp_h_conf
      - !input temp_e_abs
      - !input temp_e_eco
      - !input temp_e_conf
  - platform: numeric_state
    entity_id: !input solar_sensor
    above: !input solar_threshold
  - platform: state
    entity_id: !input delta_sensor
    for: "00:02:00"
  - platform: state
    entity_id: !input climate_entity
    to: ~

action:
  # 1. GESTION PRESENCE AUTO (Mise à jour du booléen)
  - if:
      - condition: state
        entity_id: !input switch_presence_auto
        state: "on"
      - condition: state
        entity_id: !input switch_rented
        state: "on"
      # On ne change que si l'état est différent pour éviter les boucles
      - condition: template
        value_template: "{{ states(s_pres_res) != states(s_pres_raw) }}"
    then:
      - service: input_boolean.turn_{{ states(s_pres_raw) }}
        target: { entity_id: !input switch_presence }

  # 2. GESTION CONFORT AUTO (Solaire)
  - if:
      - condition: state
        entity_id: !input switch_comfort_auto
        state: "on"
      - condition: numeric_state
        entity_id: !input solar_sensor
        above: !input solar_threshold
      - condition: state
        entity_id: !input switch_comfort
        state: "off"
    then:
      - service: input_boolean.turn_on
        target: { entity_id: !input switch_comfort }

  # 3. VERIFICATION GLOBAL OFF
  - if:
      - condition: state
        entity_id: !input switch_auto
        state: "off"
    then:
      - stop: "Gestion Auto OFF"

  # 4. DETECTION MANUEL
  - if:
      - condition: template
        value_template: "{{ trigger.entity_id == climate and trigger.to_state.context.id != this.context.id }}"
      - condition: state
        entity_id: !input switch_manual
        state: "off"
    then:
      - service: input_boolean.turn_on
        target: { entity_id: !input switch_manual }
      - service: input_text.set_value
        target: { entity_id: !input log_entity }
        data: { value: "MANUEL - Reprise main utilisateur détectée." }
      - stop: "Passage en Manuel"

  - if:
      - condition: state
        entity_id: !input switch_manual
        state: "on"
    then:
      - stop: "Mode Manuel Actif"

  # 5. CALCULS & APPLICATION
  - variables:
      is_summer: "{{ states(s_season) == 'on' }}"
      is_pres: "{{ states(s_pres_res) == 'on' }}"
      is_conf: "{{ states(s_conf_res) == 'on' }}"
      delta: "{{ states(s_delta) | float(0) }}"
      
      target_t: >
        {% if is_summer %}
          {% if not is_pres %} {{ states(te_a) }}
          {% elif is_conf %} {{ states(te_c) }}
          {% else %} {{ states(te_e) }} {% endif %}
        {% else %}
          {% if not is_pres %} {{ states(th_a) }}
          {% elif is_conf %} {{ states(th_c) }}
          {% else %} {{ states(th_e) }} {% endif %}
        {% endif %}
      
      target_hvac: >
        {% if delta < 3 %} off
        {% elif is_summer %} cool
        {% else %} heat {% endif %}

  - if:
      - condition: template
        value_template: >
          {{ state_attr(climate, 'temperature')|float(0) != target_t|float(0) 
             or states(climate) != target_hvac }}
    then:
      - service: climate.set_temperature
        target: { entity_id: !input climate_entity }
        data:
          temperature: "{{ target_t }}"
          hvac_mode: "{{ target_hvac }}"
      
      - if: "{{ f_point != [] }}"
        then:
          - service: input_number.set_value
            target: { entity_id: !input fb_setpoint }
            data: { value: "{{ target_t }}" }
      
      - if: "{{ f_mode != [] }}"
        then:
          - service: input_select.select_option
            target: { entity_id: !input fb_mode }
            data: { option: "{{ target_hvac }}" }

      - service: input_text.set_value
        target: { entity_id: !input log_entity }
        data:
          value: "AUTO - {{ target_hvac|upper }} à {{ target_t }}°C (Delta: {{ delta }}°C) - {{ now().strftime('%H:%M') }}"
